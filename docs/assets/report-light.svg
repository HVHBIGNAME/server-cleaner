<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">EXAMPLE DATA / NOT A BENCHMARK</title>
<desc id="desc">Filesystem capacity before and after a maintenance run, with task outcomes. Available-space changes include concurrent writes and are not an attribution of reclaimed bytes.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Courier New,Courier,monospace}</style>
<rect x="0.5" y="0.5" width="1099" height="569" rx="18" fill="#f3f2e9" stroke="#cdd3c0"/>
<path d="M32 78H1068M32 492H1068" stroke="#cdd3c0"/>
<text x="44" y="49" font-size="18" font-weight="700" fill="#20271b" >EXAMPLE DATA / NOT A BENCHMARK</text>
<text x="1056" y="49" font-size="13" font-weight="400" fill="#496817" text-anchor="end" class="mono">APPLY</text>
<text x="42" y="151" font-size="50" font-weight="800" fill="#20271b" >Capacity, with context.</text>
<text x="44" y="184" font-size="16" font-weight="400" fill="#616d55" >Filesystem: /  /  5 selected tasks</text>
<path d="M752 215V462" stroke="#cdd3c0"/>
<text x="44" y="237" font-size="13" font-weight="400" fill="#616d55" class="mono">BEFORE</text>
<rect x="44" y="255" width="650" height="28" rx="4" fill="#cdd3c0"/>
<rect x="44" y="255" width="526.50" height="28" fill="#496817"/>
<rect x="570.50" y="255" width="110.50" height="28" fill="#dce8bd"/>
<text x="44" y="312" font-size="16" font-weight="400" fill="#20271b" >81.00 GiB used  /  17.00 GiB available</text>
<text x="44" y="353" font-size="13" font-weight="400" fill="#616d55" class="mono">AFTER</text>
<rect x="44" y="371" width="650" height="28" rx="4" fill="#cdd3c0"/>
<rect x="44" y="371" width="503.75" height="28" fill="#496817"/>
<rect x="547.75" y="371" width="133.25" height="28" fill="#dce8bd"/>
<text x="44" y="428" font-size="16" font-weight="400" fill="#20271b" >77.50 GiB used  /  20.50 GiB available</text>
<text x="800" y="241" font-size="12" font-weight="400" fill="#616d55" class="mono">COMPLETED</text>
<text x="1056" y="241" font-size="24" font-weight="700" fill="#496817" text-anchor="end">4</text>
<rect x="800" y="252" width="256" height="4" fill="#cdd3c0"/>
<rect x="800" y="252" width="204.80" height="4" fill="#496817"/>
<text x="800" y="297" font-size="12" font-weight="400" fill="#616d55" class="mono">PLANNED</text>
<text x="1056" y="297" font-size="24" font-weight="700" fill="#616d55" text-anchor="end">0</text>
<rect x="800" y="308" width="256" height="4" fill="#cdd3c0"/>
<rect x="800" y="308" width="0.00" height="4" fill="#616d55"/>
<text x="800" y="353" font-size="12" font-weight="400" fill="#616d55" class="mono">SKIPPED</text>
<text x="1056" y="353" font-size="24" font-weight="700" fill="#616d55" text-anchor="end">1</text>
<rect x="800" y="364" width="256" height="4" fill="#cdd3c0"/>
<rect x="800" y="364" width="51.20" height="4" fill="#616d55"/>
<text x="800" y="409" font-size="12" font-weight="400" fill="#616d55" class="mono">FAILED</text>
<text x="1056" y="409" font-size="24" font-weight="700" fill="#ac362a" text-anchor="end">0</text>
<rect x="800" y="420" width="256" height="4" fill="#cdd3c0"/>
<rect x="800" y="420" width="0.00" height="4" fill="#ac362a"/>
<text x="44" y="525" font-size="17" font-weight="700" fill="#496817" >Available-space change: +3.50 GiB</text>
<text x="44" y="550" font-size="12" font-weight="400" fill="#616d55" >Root filesystem only. Includes other processes; not a reclaimed-space estimate.</text>
<text x="1056" y="525" font-size="12" font-weight="400" fill="#616d55" text-anchor="end" class="mono">HVHBIGNAME / 02</text>
</svg>
